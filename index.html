<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5f0" />
  <title>STUDY TIME | 집중 타이머</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --ink: #242820;
      --muted: #85897f;
      --green: #657b62;
      --green-dark: #4d624b;
      --line: #e9e8e1;
      --soft: #edf1e9;
      --peach: #f5e8df;
      --shadow: 0 18px 55px rgba(42, 48, 37, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: radial-gradient(circle at 10% 0%, #eeeee5 0, transparent 32%), var(--bg);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(1060px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 48px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:44px; }
    .brand { font-size: 15px; font-weight: 800; letter-spacing: .18em; }
    .brand span { color: var(--green); }
    .tag { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .intro { text-align:center; margin-bottom:30px; }
    .eyebrow { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.2em; }
    h1 { font-size: clamp(29px, 5vw, 42px); margin:12px 0 8px; letter-spacing:-.045em; }
    .sub { color:var(--muted); font-size:14px; margin:0; }
    .layout { display:grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, .8fr); gap:20px; align-items:stretch; }
    .card { background:var(--card); border:1px solid rgba(230,229,220,.9); border-radius:24px; box-shadow:var(--shadow); }
    .timer-card { padding:30px 26px 28px; text-align:center; }
    .tabs { display:flex; justify-content:center; gap:8px; margin-bottom:18px; }
    .tab { border:0; background:#f5f5f1; color:var(--muted); padding:10px 17px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:700; transition:.2s; }
    .tab.active { background:var(--soft); color:var(--green-dark); }
    .dial { width:min(300px, 72vw); aspect-ratio:1; margin:8px auto 22px; position:relative; display:grid; place-items:center; }
    .dial svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
    .track { fill:none; stroke:#eef0e9; stroke-width:8; }
    .progress { fill:none; stroke:var(--green); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .35s linear; }
    .time { font-size:clamp(54px, 9vw, 72px); line-height:1; font-weight:650; letter-spacing:-.065em; font-variant-numeric:tabular-nums; }
    .mode-label { color:var(--muted); font-size:12px; margin-top:12px; letter-spacing:.12em; font-weight:700; }
    .controls { display:flex; justify-content:center; gap:10px; }
    button { font:inherit; }
    .primary { border:0; border-radius:999px; background:var(--green); color:white; padding:14px 34px; min-width:145px; font-weight:750; cursor:pointer; box-shadow:0 7px 18px rgba(101,123,98,.2); transition:.2s; }
    .primary:hover { background:var(--green-dark); transform:translateY(-1px); }
    .secondary { border:1px solid var(--line); border-radius:999px; background:white; color:#62675e; padding:13px 19px; cursor:pointer; font-weight:650; }
    button:focus-visible { outline:3px solid #b9c9b2; outline-offset:3px; }
    .side { display:flex; flex-direction:column; gap:20px; }
    .side-card { padding:24px; }
    .section-title { margin:0 0 18px; font-size:14px; font-weight:800; letter-spacing:-.02em; }
    .stat { display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); }
    .stat:last-child { border-bottom:0; padding-bottom:0; }
    .stat-label { color:var(--muted); font-size:13px; }
    .stat-value { font-size:20px; font-weight:750; font-variant-numeric:tabular-nums; }
    .goal { background:linear-gradient(135deg, #edf1e9, #f5f3ec); }
    .goal p { color:#687363; font-size:13px; line-height:1.65; margin:0; }
    .goal strong { color:var(--green-dark); }
    .footer { text-align:center; color:#a0a398; font-size:11px; margin-top:25px; letter-spacing:.04em; }
    .notice { min-height:20px; color:var(--green-dark); font-size:12px; margin-top:15px; }
    @media (max-width:720px) {
      .wrap { padding-top:23px; }
      header { margin-bottom:34px; }
      .layout { grid-template-columns:1fr; }
      .timer-card { padding:25px 16px; }
      .side { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .side-card { padding:19px; }
    }
    @media (max-width:420px) {
      .side { grid-template-columns:1fr; }
      .tag { display:none; }
      .secondary { padding-inline:15px; }
      .primary { min-width:125px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">STUDY <span>TIME</span></div>
      <div class="tag">FOCUS ON YOUR OWN PACE</div>
    </header>

    <section class="intro">
      <div class="eyebrow">A LITTLE PROGRESS EVERY DAY</div>
      <h1>오늘도 한 걸음, 집중해 볼까요?</h1>
      <p class="sub">잠깐의 집중이 모여 큰 결과를 만듭니다.</p>
    </section>

    <section class="layout">
      <div class="card timer-card">
        <div class="tabs" role="group" aria-label="타이머 모드 선택">
          <button class="tab active" data-mode="focus">집중 25분</button>
          <button class="tab" data-mode="break">휴식 5분</button>
        </div>

        <div class="dial" aria-label="남은 시간">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="88"></circle>
            <circle class="progress" id="progress" cx="100" cy="100" r="88"></circle>
          </svg>
          <div>
            <div class="time" id="time">25:00</div>
            <div class="mode-label" id="modeLabel">FOCUS TIME</div>
          </div>
        </div>

        <div class="controls">
          <button class="primary" id="startBtn">시작하기</button>
          <button class="secondary" id="resetBtn">초기화</button>
        </div>
        <div class="notice" id="notice" aria-live="polite"></div>
      </div>

      <aside class="side">
        <div class="card side-card">
          <h2 class="section-title">오늘의 기록</h2>
          <div class="stat">
            <span class="stat-label">집중한 시간</span>
            <span class="stat-value" id="totalTime">0분</span>
          </div>
          <div class="stat">
            <span class="stat-label">완료한 세션</span>
            <span class="stat-value" id="sessions">0회</span>
          </div>
        </div>
        <div class="card side-card goal">
          <h2 class="section-title">오늘의 작은 목표</h2>
          <p>완벽하게 하려고 하기보다<br><strong>지금 할 수 있는 만큼</strong><br>차근차근 집중해 보세요.</p>
        </div>
      </aside>
    </section>
    <div class="footer">STUDY TIME · FOCUS BETTER, ONE STEP AT A TIME</div>
  </main>

  <script>
    const FOCUS_SECONDS = 25 * 60;
    const BREAK_SECONDS = 5 * 60;
    const CIRCUMFERENCE = 2 * Math.PI * 88;

    const timeEl = document.getElementById('time');
    const progressEl = document.getElementById('progress');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeLabel = document.getElementById('modeLabel');
    const notice = document.getElementById('notice');
    const totalTimeEl = document.getElementById('totalTime');
    const sessionsEl = document.getElementById('sessions');
    const tabs = [...document.querySelectorAll('.tab')];

    let mode = 'focus';
    let remaining = FOCUS_SECONDS;
    let interval = null;
    let running = false;
    let totalFocusSeconds = Number(localStorage.getItem('studyTotalSeconds') || 0);
    let completedSessions = Number(localStorage.getItem('studySessions') || 0);

    progressEl.style.strokeDasharray = CIRCUMFERENCE;
    function duration() { return mode === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS; }
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
    function render() {
      timeEl.textContent = formatTime(remaining);
      progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - remaining / duration());
      modeLabel.textContent = mode === 'focus' ? 'FOCUS TIME' : 'BREAK TIME';
      totalTimeEl.textContent = `${Math.floor(totalFocusSeconds / 60)}분`;
      sessionsEl.textContent = `${completedSessions}회`;
      startBtn.textContent = running ? '일시정지' : '시작하기';
    }
    function stopTimer() {
      if (interval) clearInterval(interval);
      interval = null;
      running = false;
      render();
    }
    function switchMode(nextMode) {
      stopTimer();
      mode = nextMode;
      remaining = duration();
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
      notice.textContent = mode === 'focus' ? '집중할 준비가 되셨나요?' : '잠깐 쉬어가도 괜찮아요.';
      render();
    }
    function completeTimer() {
      stopTimer();
      if (mode === 'focus') {
        totalFocusSeconds += FOCUS_SECONDS;
        completedSessions += 1;
        localStorage.setItem('studyTotalSeconds', totalFocusSeconds);
        localStorage.setItem('studySessions', completedSessions);
        notice.textContent = '집중 세션 완료! 수고했어요. 잠깐 쉬어가세요.';
        alert('집중 세션을 완료했어요! 수고하셨습니다.');
      } else {
        notice.textContent = '휴식이 끝났어요. 다시 집중해 볼까요?';
        alert('휴식이 끝났어요. 다시 집중해 볼까요?');
      }
      render();
    }
    function tick() {
      if (remaining > 0) {
        remaining -= 1;
        if (mode === 'focus') {
          totalFocusSeconds += 1;
          localStorage.setItem('studyTotalSeconds', totalFocusSeconds);
        }
        render();
      }
      if (remaining <= 0) completeTimer();
    }
    startBtn.addEventListener('click', () => {
      if (running) {
        stopTimer();
        notice.textContent = '타이머를 잠시 멈췄어요.';
      } else {
        running = true;
        notice.textContent = '좋아요. 지금 이 순간에 집중해 보세요!';
        interval = setInterval(tick, 1000);
        render();
      }
    });
    resetBtn.addEventListener('click', () => {
      stopTimer();
      remaining = duration();
      notice.textContent = '타이머를 초기화했어요.';
      render();
    });
    tabs.forEach(tab => tab.addEventListener('click', () => switchMode(tab.dataset.mode)));
    render();
  </script>
</body>
</html>
